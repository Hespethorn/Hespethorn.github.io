# --------------------------------------
# Beautify / Effect
# --------------------------------------

  #Theme color for customize
theme_color:
    enable: false  # 启用自定义主题色
    main: "#8FBC8F"  # 中绿色主色调（原#B3D1B3）
    paginator: "#A9D0A9"  # 适中绿色分页器（原#C8E6C9）
    button_hover: "#9FCB9F"  # 中绿色按钮悬停（原#D7EED8）
    link_color: "#3E6B3E"  # 深绿色链接（原#4A7B4A）
    meta_color: "#6A996A"  # 适中绿色元数据文字（原#7A9E7A）
    hr_color: "#E5F0E5"  # 浅灰绿色分隔线（原#F0F7F0）
    text_selection: "#A3D9A3"  # 中绿色选中文本（原#C6E0C6）
    code_foreground: "#2D572D"  # 深绿色代码文字（原#3A5E3A）
    code_background: "#E8F0E8"  # 浅灰绿色代码背景（原#F5F9F5）
